name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-cli:
    strategy:
      matrix:
        node: ["24.21.0", "26"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install compatibility-test tools
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep
      - run: npm ci
      - name: Check thin shell wrappers
        run: bash -n bootstrap.sh install.sh verify.sh install-project.sh bin/reconcile-config
      - name: Typecheck, validate policy, and test
        run: npm run check
      - name: Check whitespace
        run: git diff --check
