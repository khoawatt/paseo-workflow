name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep
      - name: Check shell syntax
        run: find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
      - name: Check JSON fixtures and policy
        run: find policy tests/fixtures -type f -name '*.json' -print0 | xargs -0 -n1 jq empty
      - name: Run isolated fixture suite
        run: bash tests/test.sh
      - name: Check whitespace
        run: git diff --check
